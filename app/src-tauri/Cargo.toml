[package]
name = "t-trade-desk"
version = "0.1.0"
description = "做T决策台 · Tauri 2 desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "t_trade_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
encoding_rs = "0.8"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
